# Extra settings. Colors are hex and paint the commands table.
config:
  colors:
    title: "#5fd7ff"
    group: "#2CEAA3"
    command: "#ffd75f"
    description: "#dadada"
    border: "#5f5f5f"

sheets:
  - id: tmux
    description: Terminal multiplexer
    groups:
      - name: Sessions
        items:
          - command: tmux new -s mysession
            description: New session
          - command: tmux ls
            description: List all sessions
          - command: tmux a -t mysession
            description: Attach to session
          - command: ctrl+b s
            description: View and switch sessions
          - command: ctrl+b $
            description: Rename session
          - command: ctrl+b (
            description: Previous session
          - command: ctrl+b )
            description: Next session

      - name: Windows
        items:
          - command: ctrl+b c
            description: New window
          - command: ctrl+b ,
            description: Rename window
          - command: ctrl+b w
            description: List windows
          - command: ctrl+b &
            description: Kill window
          - command: ctrl+b p
            description: Previous window
          - command: ctrl+b n
            description: Next window
          - command: ctrl+b 0-9
            description: Select window by number

      - name: Panes
        items:
          - command: ctrl+b %
            description: Split the current pane with a vertical line to create a horizontal layout
          - command: ctrl+b "
            description: Split the current pane with a horizontal line to create a vertical layout
          - command: ctrl+b z
            description: Zoom in/out of pane
          - command: ctrl+b x
            description: Kill pane
          - command: ctrl+b $arrow
            description: Move between panes

  - id: superfile
    description: Terminal file manager (spf)
    groups:
      - name: Navigation
        items:
          - command: j / k
            description: Move down / up in the panel
          - command: "l / enter"
            description: Open file or enter directory
          - command: "h / backspace"
            description: Go to the parent directory
          - command: pgdown / pgup
            description: Move a page down / up
          - command: "/"
            description: Search in the current panel
          - command: z
            description: Jump to a directory with zoxide
          - command: "P"
            description: Open the pinned directories
          - command: "."
            description: Show/hide dot files
          - command: "q"
            description: Quit (Q quits and cd into the last dir)

      - name: Panels
        items:
          - command: n
            description: Create a new file panel
          - command: "N"
            description: Split the current file panel
          - command: w
            description: Close the current file panel
          - command: tab
            description: Next file panel (shift+left for the previous one)
          - command: f
            description: Toggle the file preview panel
          - command: s
            description: Focus on the sidebar
          - command: m
            description: Focus on the metadata panel
          - command: p
            description: Focus on the process bar
          - command: "F"
            description: Toggle the footer

      - name: Files
        items:
          - command: ctrl+n
            description: Create a new file or directory
          - command: ctrl+r
            description: Rename the selected item
          - command: ctrl+c
            description: Copy the selected items
          - command: ctrl+x
            description: Cut the selected items
          - command: ctrl+v
            description: Paste the items
          - command: ctrl+d
            description: Delete the selected items (to trash)
          - command: "D"
            description: Delete the selected items permanently
          - command: ctrl+a
            description: Compress the selected items
          - command: ctrl+e
            description: Extract the selected archive
          - command: e
            description: Open the file with your editor (E for the directory)
          - command: ctrl+p
            description: Copy the path of the selected item
          - command: c
            description: Copy the current working directory

      - name: Selection
        items:
          - command: v
            description: Toggle the select mode
          - command: "J / K"
            description: Select down / up in select mode
          - command: "A"
            description: Select all items in the panel

      - name: Menus
        items:
          - command: "?"
            description: Open the help menu
          - command: ":"
            description: Open the command line
          - command: ">"
            description: Open the spf prompt
          - command: o
            description: Open the sort options menu
          - command: "R"
            description: Toggle the reverse sort

  - id: herdr
    description: Terminal workspace manager for AI coding agents
    groups:
      - name: CLI
        items:
          - command: herdr
            description: Launch or attach to the persistent session
          - command: herdr --session <name>
            description: Use or create a named session
          - command: herdr session attach <name>
            description: Attach to a named session
          - command: herdr --remote <ssh-target>
            description: Attach through SSH to a remote server
          - command: herdr status
            description: Show the client and server status
          - command: herdr update
            description: Download and install the latest version
          - command: herdr server stop
            description: Stop the running server
          - command: herdr server reload-config
            description: Reload config.toml in the running server
          - command: herdr channel set <stable|preview>
            description: Choose the stable or preview update channel
          - command: herdr --default-config
            description: Print the default configuration
          - command: herdr completion zsh
            description: Generate the zsh completions

      - name: Workspaces
        items:
          - command: ctrl+b w
            description: Open the workspace picker
          - command: ctrl+b g
            description: Go to a workspace, tab or pane
          - command: ctrl+b shift+n
            description: New workspace
          - command: ctrl+b shift+w
            description: Rename the workspace
          - command: ctrl+b shift+d
            description: Close the workspace
          - command: ctrl+b shift+g
            description: New git worktree

      - name: Tabs
        items:
          - command: ctrl+b c
            description: New tab
          - command: ctrl+b n
            description: Next tab (p for the previous one)
          - command: ctrl+b 1-9
            description: Switch to the tab by number
          - command: ctrl+b shift+t
            description: Rename the tab
          - command: ctrl+b shift+x
            description: Close the tab

      - name: Panes
        items:
          - command: ctrl+b v
            description: Split the pane vertically
          - command: "ctrl+b -"
            description: Split the pane horizontally
          - command: ctrl+b h/j/k/l
            description: Focus the pane on that direction
          - command: ctrl+b tab
            description: Cycle to the next pane (shift+tab goes back)
          - command: ctrl+b z
            description: Zoom in/out of the pane
          - command: ctrl+b r
            description: Enter the resize mode
          - command: ctrl+b x
            description: Close the pane
          - command: ctrl+b shift+p
            description: Rename the pane
          - command: ctrl+b e
            description: Edit the scrollback

      - name: Session
        items:
          - command: "ctrl+b ?"
            description: Open the help
          - command: ctrl+b s
            description: Open the settings
          - command: ctrl+b b
            description: Toggle the sidebar
          - command: ctrl+b o
            description: Open the notification target
          - command: ctrl+b shift+r
            description: Reload the config
          - command: ctrl+b q
            description: Detach from the session

  - id: ccs
    description: Commands of this cheat sheet tool
    groups:
      - name: Basics
        items:
          - command: ccs ls
            description: List all cheat sheets
          - command: ccs <sheet>
            description: Print a cheat sheet as a table
          - command: ccs <sheet> <term>
            description: Print only the items matching a term
      - name: Config
        items:
          - command: ccs --path
            description: Show which file is being read
          - command: ccs --plain
            description: Render without table borders
          - command: CHEAT_SHEETS_FILE_PATH=./my.yaml ccs ls
            description: Read the sheets from another file
